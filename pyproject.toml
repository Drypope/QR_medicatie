[project]
name = "medmatrix"
version = "0.1.0"
description = "Local FastAPI Data Matrix medication app"
requires-python = ">=3.10,<3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "jinja2>=3.1,<4.0",
  "pydantic-settings>=2.3,<3.0",
  "openpyxl>=3.1,<4.0",
  "pillow>=10.4,<11.0",
  "pylibdmtx>=0.1.10,<0.2.0",
  "python-multipart>=0.0.9,<0.1.0",
  "itsdangerous>=2.2,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
